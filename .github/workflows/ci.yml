name: CI

on:
  push:
    branches: [android]
  pull_request:
    branches: [android]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build library and sample
        run: ./gradlew :flipbook:assembleRelease :sample:assembleDebug
      - name: Check the JitPack publication
        run: ./gradlew :flipbook:publishReleasePublicationToMavenLocal -Pversion=ci
