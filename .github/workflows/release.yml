name: Release

on:
  push:
    branches: [website]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          target-branch: website
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Attach the website ZIP to the GitHub Release
        run: |
          ZIP="scoreplus-flipbook-website-${TAG#website-v}.zip"
          git archive --format=zip --output="$ZIP" HEAD
          gh release upload "$TAG" "$ZIP" --clobber

  update-readme:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the main README at the new release
        run: |
          sed -i -E "s/@website-v[0-9]+\.[0-9]+\.[0-9]+/@$TAG/g" README.md
          if git diff --quiet; then
            echo "README already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: point README at $TAG"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
